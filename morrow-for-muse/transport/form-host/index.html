<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Morrow API form helper</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 40rem;
         margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  button { font-size: 1.25rem; padding: 0.75rem 2rem; cursor: pointer; }
  code { background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 3px;
         word-break: break-all; }
  .note { color: #555; font-size: 0.9rem; }
  .err { color: #a00; }
</style>
</head>
<body>
<h1>Morrow API form helper</h1>
<p class="note">This page turns a form specification carried in the URL fragment
(the part after <code>#</code>, which is never sent to any server) into a real
HTML form and posts it. Nothing you submit here is logged by this page.</p>
<div id="app"><p>Loading form&hellip;</p></div>
<script>
/*
 * Destination policy (product contract, enforced in transport/batch.py):
 * every spec.action the product renders is confined to the educator's own
 * tenant origin (base + relative path, https-only, origin-checked at render
 * time). This page keeps an https-only backstop check because the static
 * page cannot know the educator's tenant.
 *
 * Bundled model: this file ships INSIDE the connector bundle
 * (transport/form-host/index.html). The product serves it over an ephemeral
 * localhost HTTP server (transport/form_host_server.py: 127.0.0.1 only,
 * this page only, tight CSP headers) because the managed browser
 * environment cannot load file:// URLs. A file:// URL into the bundle
 * remains usable where the browser supports it. There is no remote server,
 * no hosting, and no deploy step: the in-page backstop below is the
 * enforcement that travels with the file, and the localhost server adds
 * CSP headers on top.
 * Do not publish this page to any hosted service.
 */
(function () {
  var app = document.getElementById('app');
  function fail(msg) {
    app.innerHTML = '<p class="err">Could not build the form: ' +
      String(msg).replace(/[<>&]/g, '') + '</p>';
  }
  var raw = location.hash.slice(1);
  if (!raw) { fail('no form spec in the URL fragment'); return; }
  var spec;
  try { spec = JSON.parse(decodeURIComponent(raw)); }
  catch (e) { fail('the fragment is not valid encoded JSON'); return; }
  if (!spec || typeof spec.action !== 'string' || !/^https:\/\//.test(spec.action)) {
    fail('spec.action must be an https URL'); return;
  }
  var fields = spec.fields || {};
  var form = document.createElement('form');
  form.method = 'POST';
  form.action = spec.action;
  Object.keys(fields).forEach(function (name) {
    var vals = fields[name];
    if (!Array.isArray(vals)) vals = [vals];
    vals.forEach(function (v) {
      var inp = document.createElement('input');
      inp.type = 'hidden';
      inp.name = String(name);
      inp.value = v === null || v === undefined ? '' : String(v);
      form.appendChild(inp);
    });
  });
  if (spec.method === 'PUT' || spec.method === 'DELETE') {
    var m = document.createElement('input');
    m.type = 'hidden'; m.name = '_method'; m.value = spec.method;
    form.appendChild(m);
  }
  var names = Object.keys(fields);
  var summary = document.createElement('p');
  summary.innerHTML = 'Posting to <code></code> with ' + names.length +
    ' field group(s)' + (spec.method === 'PUT' || spec.method === 'DELETE'
      ? ' (as HTTP ' + spec.method + ' via method override)' : '') + '.';
  summary.querySelector('code').textContent = spec.action;
  var btn = document.createElement('button');
  btn.type = 'submit';
  btn.textContent = 'Submit';
  var note = document.createElement('p');
  note.className = 'note';
  note.textContent = 'After submitting, this tab shows the API response. ' +
    'Field values are not displayed here.';
  app.innerHTML = '';
  app.appendChild(summary);
  app.appendChild(form);
  form.appendChild(btn);
  app.appendChild(note);
})();
</script>
</body>
</html>
