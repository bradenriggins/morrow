packages:
  - .
engineStrict: true
saveExact: true
strictPeerDependencies: true
minimumReleaseAge: 0
overrides:
  tmp@<0.2.6: 0.2.7
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
allowBuilds:
  electron: true
  electron-winstaller: false
# GHSA-86w9-cpqp-85rv (CVE-2026-85393): node-forge signature verification,
# via @anthropic-ai/mcpb. No patched forge release exists and mcpb 2.1.2 is
# latest. Morrow calls only mcpb packExtension; forge is reachable solely from
# mcpb signMcpbFile, which Morrow never calls, and no signature is verified.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    # GHSA-ch52-4w7c-c8xp / CVE-2026-93748: unpatched shared HTTP-cache disclosure.
    # Pinned build-only path: electron-builder26.15.3 -> app-builder-lib ->
    # @electron/get3.1.0 -> got11.8.6 -> cacheable-request7.0.4 -> http-cache-semantics4.2.0.
    # Morrow sets no HTTP response cache; actual builder and positive-control proof
    # confirms CachePolicy is never constructed in the release download path.
    # The application production closure excludes the chain. Bundled Node/npm has
    # a dormant copy, but Morrow never invokes npm/npx/corepack.
    # Rechecked by dependency-cache-audit.test.cjs; review on every builder bump.
    # Remove when a patched package or supported stable builder/get5 toolchain ships.
    - GHSA-ch52-4w7c-c8xp
