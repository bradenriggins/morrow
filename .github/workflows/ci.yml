name: ci

# Monorepo CI. The `changes` job detects which products a push/PR touches;
# each product suite runs only when its directory changed. The `check` job
# aggregates both suites and keeps the required status-check name stable,
# so branch protection keeps working when a change touches one product only
# (the other suite skips, and `check` still reports). A workflow change runs
# both suites.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      muse: ${{ steps.filter.outputs.muse }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - '.github/**'
            muse:
              - 'morrow-for-muse/**'
              - '.github/**'

  check-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.6.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Install desktop installer dependencies
        run: pnpm --dir installer --ignore-workspace install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      # pnpm check already runs the desktop installer suites (pnpm test ends with pnpm test:desktop).
      - name: Browser integration harnesses
        run: xvfb-run -a node scripts/run-browser-harnesses.mjs

  check-muse:
    needs: changes
    if: needs.changes.outputs.muse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: morrow-for-muse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest
      - name: Install dev dependencies (hash-locked)
        run: pip install -r requirements-dev.txt
      - name: Install optional dependencies (hash-locked; the learner-privacy tests need cryptography)
        run: |
          pip install -r requirements-optional.txt
          python -c "import cryptography"
      - name: Muse test suite
        run: python -m pytest -q

  check:
    needs: [changes, check-desktop, check-muse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate product suites
        env:
          CHANGES: ${{ needs.changes.result }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
          DESKTOP: ${{ needs.check-desktop.result }}
          MUSE_CHANGED: ${{ needs.changes.outputs.muse }}
          MUSE: ${{ needs.check-muse.result }}
        run: |
          # A skipped suite passes only when change detection succeeded and
          # said that product did not change.
          if [ "$CHANGES" != "success" ]; then
            echo "Change detection did not succeed: $CHANGES"
            exit 1
          fi
          fail=0
          for pair in "desktop:$DESKTOP_CHANGED:$DESKTOP" "muse:$MUSE_CHANGED:$MUSE"; do
            IFS=: read -r name changed result <<< "$pair"
            if [ "$changed" = "true" ] && [ "$result" != "success" ]; then
              echo "$name suite result: $result"
              fail=1
            elif [ "$changed" != "true" ] && [ "$result" != "skipped" ]; then
              echo "$name suite ran without a detected change: $result"
              [ "$result" = "success" ] || fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "A product suite did not pass."
            exit 1
          fi
          echo "Every changed product's suite passed."
