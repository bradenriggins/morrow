name: ci

# Monorepo CI. The `changes` job detects which products a push/PR touches;
# each product suite runs only when its directory, or a root file it reads,
# changed. The
# `check-repository` job runs the repository text gates on every change,
# because they read every tracked file, including the root documents and
# Morrow for Muse. The `check` job aggregates every job and keeps the
# required status-check name stable, so branch protection keeps working when
# a change touches one product only (the other suite skips, and `check` still
# reports). A workflow change runs every suite.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      muse: ${{ steps.filter.outputs.muse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A root file a product reads is in that product's filter:
      # desktop/scripts/test/lib/ci-path-filters.mjs says which suite reads
      # each one, and ci-path-filters.test.mjs holds these filters to it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - '.github/**'
              - '.gitattributes'
              - 'docs/versioning.md'
            muse:
              - 'morrow-for-muse/**'
              - '.github/**'
              - '.gitattributes'
              - '.gitignore'
              - 'LICENSE'

  # No em dash and no retired phrase anywhere in the repository, the
  # security policy and issue templates keep security reports and student
  # information out of public issues, and every root file a product reads
  # runs that product's suites. These gates need only Node, so they run from
  # the repository root with nothing to install.
  check-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: node --test desktop/scripts/test/no-em-dash.test.mjs desktop/scripts/test/product-claims.test.mjs desktop/scripts/test/repository-policy.test.mjs desktop/scripts/test/ci-path-filters.test.mjs

  check-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Install desktop installer dependencies
        run: pnpm --dir installer --ignore-workspace install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      # pnpm check already runs the desktop installer suites (pnpm test ends with pnpm test:desktop).
      - name: Browser integration harnesses
        run: xvfb-run -a node scripts/run-browser-harnesses.mjs

  # Morrow Desktop ships for Windows and for macOS on Apple silicon, never
  # Linux. These jobs run the installer contracts, and every desktop test that
  # Linux skips, on the runners desktop-release.yml packages on, so a defect
  # that shows only on a shipped platform fails the required check.
  check-desktop-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Install desktop installer dependencies
        run: pnpm --dir installer --ignore-workspace install --frozen-lockfile
      - run: pnpm build
      - name: Start pnpm with no shell, as the release packager does
        run: node --test scripts/test/pnpm-command.test.mjs
      - name: Check out the committed bytes the release packager seals and reads
        run: node --test scripts/test/checkout-line-endings.test.mjs
      - name: Test each installer contract file with a process limit
        timeout-minutes: 23
        run: pnpm --dir installer --ignore-workspace test:bounded:files
      - name: Test the complete installer contract suite with a process limit
        timeout-minutes: 7
        run: pnpm --dir installer --ignore-workspace test:bounded:suite

  check-desktop-macos:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Install desktop installer dependencies
        run: pnpm --dir installer --ignore-workspace install --frozen-lockfile
      - run: pnpm build
      - name: Installer contracts
        run: pnpm --dir installer --ignore-workspace test
      - name: Update harness, including the cancelled download Linux skips
        run: pnpm test:desktop:update
      - name: macOS-only access-control hardening
        run: pnpm --dir packages/gateway-core exec vitest run test/private-file-access.test.ts
      - name: Assistant configuration writes on macOS
        run: pnpm --dir packages/client-config exec vitest run test/client-config.test.ts
      - name: The release workflow's macOS smoke command
        run: node --test scripts/test/desktop-release-workflow.test.mjs

  check-muse:
    needs: changes
    if: needs.changes.outputs.muse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: morrow-for-muse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependencies (hash-locked)
        run: pip install -r requirements-test.txt
      - name: Install dev dependencies (hash-locked)
        run: pip install -r requirements-dev.txt
      - name: Install optional dependencies (hash-locked; the learner-privacy tests need cryptography)
        run: |
          pip install -r requirements-optional.txt
          python -c "import cryptography"
      - name: Muse test suite
        run: python -m pytest -q
      # The selftests that are not install suites (pytest collects none
      # of them), with the install runner's isolation.
      - name: Dev selftest suites
        run: bash scripts/dev-suites.sh --show-failures
      # pytest collects none of the *_selftest.py install suites. Carve
      # the release tree the way a release does (the carve also runs the
      # secrets gate with no exclusions), then run the install suites
      # from it through the runner install.sh step 9 uses.
      - name: Carve the release tree
        run: python scripts/carve.py --out "$RUNNER_TEMP/carve/morrow-muse-connector"
      - name: Install suites on the carved tree
        run: bash "$RUNNER_TEMP/carve/morrow-muse-connector/scripts/install-suites.sh" --show-failures

  check:
    needs: [changes, check-repository, check-desktop, check-desktop-windows, check-desktop-macos, check-muse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate product suites
        env:
          CHANGES: ${{ needs.changes.result }}
          REPOSITORY: ${{ needs.check-repository.result }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
          DESKTOP: ${{ needs.check-desktop.result }}
          DESKTOP_WINDOWS: ${{ needs.check-desktop-windows.result }}
          DESKTOP_MACOS: ${{ needs.check-desktop-macos.result }}
          MUSE_CHANGED: ${{ needs.changes.outputs.muse }}
          MUSE: ${{ needs.check-muse.result }}
        run: |
          # A skipped suite passes only when change detection succeeded and
          # said that product did not change.
          if [ "$CHANGES" != "success" ]; then
            echo "Change detection did not succeed: $CHANGES"
            exit 1
          fi
          fail=0
          # The repository text gates run on every change, whatever changed.
          if [ "$REPOSITORY" != "success" ]; then
            echo "repository text gates result: $REPOSITORY"
            fail=1
          fi
          for pair in \
            "desktop:$DESKTOP_CHANGED:$DESKTOP" \
            "desktop-windows:$DESKTOP_CHANGED:$DESKTOP_WINDOWS" \
            "desktop-macos:$DESKTOP_CHANGED:$DESKTOP_MACOS" \
            "muse:$MUSE_CHANGED:$MUSE"; do
            IFS=: read -r name changed result <<< "$pair"
            if [ "$changed" = "true" ] && [ "$result" != "success" ]; then
              echo "$name suite result: $result"
              fail=1
            elif [ "$changed" != "true" ] && [ "$result" != "skipped" ]; then
              echo "$name suite ran without a detected change: $result"
              [ "$result" = "success" ] || fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "The repository text gates or a product suite did not pass."
            exit 1
          fi
          echo "Every changed product's suite passed."
