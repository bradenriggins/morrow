name: desktop installer QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows x64 unsigned installer and installed-app smoke
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.6.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install installer dependencies
        run: pnpm --dir installer --ignore-workspace install --frozen-lockfile

      # Reports whether a signed release could be built here. With no signing
      # secrets it says so and this unsigned QA build continues; a partial
      # signing configuration fails the job.
      - name: Preflight the signed release configuration
        env:
          WIN_CSC_LINK: ${{ secrets.MORROW_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.MORROW_WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.MORROW_GH_TOKEN }}
        run: node installer/signed-release-preflight.cjs --target win32-x64 --summary

      - name: Build Morrow packages
        run: pnpm build

      - name: Test each installer contract file with a process limit
        timeout-minutes: 23
        run: pnpm --dir installer --ignore-workspace test:bounded:files

      - name: Test the complete installer contract suite with a process limit
        timeout-minutes: 7
        run: pnpm --dir installer --ignore-workspace test:bounded:suite

      - name: Prepare private Windows artifact directory
        shell: pwsh
        run: |
          $runId = [guid]::NewGuid().ToString("N")
          $packageOutput = Join-Path $env:RUNNER_TEMP "morrow-desktop-package-$runId"
          $artifactRoot = Join-Path $PWD "artifacts\desktop-windows-private-qa"
          if (Test-Path -LiteralPath $artifactRoot) { throw "Private QA artifact directory already exists: $artifactRoot" }
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          "MORROW_WINDOWS_PACKAGE_OUTPUT=$packageOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MORROW_WINDOWS_ARTIFACT_ROOT=$artifactRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package unsigned Windows NSIS installer
        shell: pwsh
        run: |
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          node scripts/package-mcp-bundle.mjs --target win32-x64 --unsigned-qa --output $env:MORROW_WINDOWS_PACKAGE_OUTPUT
          $installers = @(Get-ChildItem $env:MORROW_WINDOWS_PACKAGE_OUTPUT -File | Where-Object { $_.Name -match '^Morrow-.+-win-x64\.exe$' })
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows NSIS installer; found $($installers.Count)." }
          $artifactInstaller = Join-Path $env:MORROW_WINDOWS_ARTIFACT_ROOT $installers[0].Name
          if (Test-Path -LiteralPath $artifactInstaller) { throw "Private QA installer already exists: $artifactInstaller" }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $artifactInstaller
          Copy-Item -LiteralPath (Join-Path $env:MORROW_WINDOWS_PACKAGE_OUTPUT 'receipt.json') -Destination (Join-Path $env:MORROW_WINDOWS_ARTIFACT_ROOT 'package-receipt.json')
          "MORROW_WINDOWS_INSTALLER=$artifactInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upgrade the exact published 3720 build and preserve its state
        timeout-minutes: 32
        shell: pwsh
        run: |
          $oldUrl = 'https://github.com/bradenriggins/morrow-downloads/releases/download/v1.0.0/Morrow-1.0.0-win-x64-3720b76b-baseline.exe'
          $oldSha256 = '2750cd7b6746fb7f6701a92920158691eb9ad787732826597f6de4c3ed0fadf1'
          $oldSourceHead = '3720b76bfd5dc5d132627777be4034bf9ef0dae5'
          $runId = [guid]::NewGuid().ToString('N')
          $oldInstaller = Join-Path $env:RUNNER_TEMP "Morrow-1.0.0-published-3720b76b-$runId.exe"
          Invoke-WebRequest -Uri $oldUrl -OutFile $oldInstaller
          $downloadedHash = (Get-FileHash -LiteralPath $oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedHash -ne $oldSha256) { throw "The published installer hash is $downloadedHash, not the pinned value." }
          $newSha256 = (Get-FileHash -LiteralPath $env:MORROW_WINDOWS_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          $newSourceHead = $env:GITHUB_SHA.ToLowerInvariant()
          $installDir = Join-Path $env:RUNNER_TEMP "morrow-upgrade-install-$runId"
          $stateDir = Join-Path $env:LOCALAPPDATA "MorrowUpgradeTest-$runId"
          $receipt = Join-Path $env:MORROW_WINDOWS_ARTIFACT_ROOT 'upgrade.json'
          & scripts/test/desktop-windows-upgrade.ps1 `
            -OldInstaller $oldInstaller -OldSha256 $oldSha256 -OldSourceHead $oldSourceHead `
            -NewInstaller $env:MORROW_WINDOWS_INSTALLER -NewSha256 $newSha256 -NewSourceHead $newSourceHead `
            -InstallDirectory $installDir -StateDirectory $stateDir -Receipt $receipt

      - name: Install, start, damage and repair the sealed payload, uninstall, and check retained data
        timeout-minutes: 30
        shell: pwsh
        run: |
          $runId = [guid]::NewGuid().ToString("N")
          $installDir = Join-Path $env:RUNNER_TEMP "morrow-install-$runId"
          $receipt = Join-Path $env:MORROW_WINDOWS_ARTIFACT_ROOT "smoke.json"
          node scripts/test/desktop-windows-smoke.mjs --installer $env:MORROW_WINDOWS_INSTALLER --package-receipt (Join-Path $env:MORROW_WINDOWS_ARTIFACT_ROOT 'package-receipt.json') --install-dir $installDir --receipt $receipt --source $env:GITHUB_SHA --run-id $runId

      - name: Upload private QA installer and sanitized smoke receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: morrow-windows-desktop-${{ github.run_id }}
          path: desktop/artifacts/desktop-windows-private-qa
          if-no-files-found: error
          retention-days: 14

  macos-installer:
    name: macOS Apple silicon unsigned disk image and installed-app smoke
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.6.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install installer dependencies
        run: pnpm --dir installer --ignore-workspace install --frozen-lockfile

      # Reports whether a signed and notarized release could be built here. With
      # no signing secrets it says so and this unsigned QA build continues; a
      # partial signing configuration fails the job.
      - name: Preflight the signed release configuration
        env:
          CSC_LINK: ${{ secrets.MORROW_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MORROW_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.MORROW_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.MORROW_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MORROW_APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.MORROW_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MORROW_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MORROW_APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.MORROW_GH_TOKEN }}
        run: node installer/signed-release-preflight.cjs --target darwin-arm64 --summary

      - name: Build Morrow packages
        run: pnpm build

      - name: Test installer contracts
        run: pnpm --dir installer --ignore-workspace test

      - name: Package the unsigned Apple silicon payload, disk image, and archive
        shell: bash
        env:
          MORROW_SIGNED_RELEASE: "0"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          shopt -s nullglob
          unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD
          unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          unset GH_TOKEN GITHUB_TOKEN
          artifactRoot="$PWD/artifacts/desktop-macos-private-qa"
          if [ -e "$artifactRoot" ]; then
            echo "Private QA artifact directory already exists: $artifactRoot" >&2
            exit 1
          fi
          mkdir -p "$artifactRoot"
          packageOutput="$RUNNER_TEMP/morrow-desktop-package-$(uuidgen)"
          node scripts/package-mcp-bundle.mjs --target darwin-arm64 --unsigned-qa --output "$packageOutput"
          images=("$packageOutput"/Morrow-*-mac-arm64.dmg)
          archives=("$packageOutput"/Morrow-*-mac-arm64.zip)
          if [ "${#images[@]}" -ne 1 ] || [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Morrow macOS disk image and one archive; found ${#images[@]} and ${#archives[@]}." >&2
            exit 1
          fi
          cp "$packageOutput/receipt.json" "$artifactRoot/package-receipt.json"
          cp "${images[0]}" "$artifactRoot/$(basename "${images[0]}")"
          cp "${archives[0]}" "$artifactRoot/$(basename "${archives[0]}")"
          runId="$(uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          echo "MORROW_MAC_DISK_IMAGE=$artifactRoot/$(basename "${images[0]}")" >> "$GITHUB_ENV"
          echo "MORROW_MAC_ARTIFACT_ROOT=$artifactRoot" >> "$GITHUB_ENV"
          echo "MORROW_MAC_RUN_ID=$runId" >> "$GITHUB_ENV"

      - name: Start the built application and record one contained run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test/desktop-mac-smoke.mjs --disk-image "$MORROW_MAC_DISK_IMAGE" --package-receipt "$MORROW_MAC_ARTIFACT_ROOT/package-receipt.json" --receipt "$MORROW_MAC_ARTIFACT_ROOT/receipt.json" --source "$GITHUB_SHA" --run-id "$MORROW_MAC_RUN_ID"

      - name: Upload private QA disk image and sanitized smoke receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: morrow-macos-desktop-${{ github.run_id }}
          path: desktop/artifacts/desktop-macos-private-qa
          if-no-files-found: error
          retention-days: 14
