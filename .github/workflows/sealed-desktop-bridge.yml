name: sealed Desktop Bridge qualification

on:
  workflow_dispatch:
    inputs:
      qa_run:
        description: Successful desktop installer QA run holding the retained artifact
        type: string
        default: '37649115964'
        required: true
      package_source:
        description: Exact source commit in the retained package receipt
        type: string
        default: '1ed0c70c82dc74b2a506e6ac0004bad29fbfa43a'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  sealed-bridge:
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Install only Playwright's bundled Chrome for Testing
        run: pnpm exec playwright install chromium
      - name: Download the exact successful QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN: ${{ inputs.qa_run }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
        run: |
          node -e 'if (!/^[1-9][0-9]*$/.test(process.env.QA_RUN) || !/^[0-9a-f]{40}$/.test(process.env.PACKAGE_SOURCE)) process.exit(1)'
          gh run view "$QA_RUN" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,conclusion,workflowName > "$RUNNER_TEMP/qa-source.json"
          node --input-type=module -e 'import fs from "node:fs"; import {verifyQaSource} from "./scripts/test/sealed-desktop-bridge.mjs"; verifyQaSource(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/qa-source.json")),process.env.PACKAGE_SOURCE,process.env.QA_RUN)'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/qa-artifacts.json"
          python3 scripts/test/sealed-qa-artifact.py select --metadata "$RUNNER_TEMP/qa-artifacts.json" --source "$PACKAGE_SOURCE" --run "$QA_RUN" > "$RUNNER_TEMP/qa-artifact-id"
          read -r ARTIFACT_ID < "$RUNNER_TEMP/qa-artifact-id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/qa-artifact.zip"
          python3 scripts/test/sealed-qa-artifact.py extract --metadata "$RUNNER_TEMP/qa-artifacts.json" --source "$PACKAGE_SOURCE" --run "$QA_RUN" --archive "$RUNNER_TEMP/qa-artifact.zip" --destination "$RUNNER_TEMP/retained-desktop-qa"
      - name: Pair exact sealed Bridge with retained packaged Desktop
        env:
          QA_RUN: ${{ inputs.qa_run }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
        run: |
          node scripts/test/sealed-desktop-bridge.mjs --artifact-directory "$RUNNER_TEMP/retained-desktop-qa" --package-source "$PACKAGE_SOURCE" --qa-run "$QA_RUN" --qa-record "$RUNNER_TEMP/qa-source.json" --artifact-metadata "$RUNNER_TEMP/qa-artifacts.json" --receipt "$PWD/output/sealed-desktop-bridge/receipt.json"
      - name: Retain only the sanitized authoritative receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-desktop-bridge-${{ github.sha }}-${{ github.run_id }}
          path: desktop/output/sealed-desktop-bridge/receipt.json
          if-no-files-found: warn
          retention-days: 14
