version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /desktop/installer
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /morrow-for-muse
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Chicago
    open-pull-requests-limit: 10
